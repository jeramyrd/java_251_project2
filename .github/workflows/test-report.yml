name: Test Report

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Download JUnit XML artifact
        uses: actions/download-artifact@v6
        with:
          name: test-results
          # download into this local folder
          path: test-results
          # fetch from the CI workflow run that just completed
          run-id: ${{ github.event.workflow_run.id }}

      - name: Annotate test results in Checks
        uses: dorny/test-reporter@v3
        with:
          artifact: test-results
          name: JUnit Tests
          path: '*.xml'
          reporter: java-junit
