name: CI

on:
  push:
    # run on pushes to any branch (or restrict to main if you like)
    branches: [ '**' ]
  pull_request:
    # run on PRs as before
    branches: [ '**' ]

permissions:
  contents: read    # you need to read source
  actions:  read    # to download artifacts
  checks:   write   # to annotate the check run

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Compile sources & tests
        run: |
          mkdir -p bin
          javac -d bin \
            -cp "project2.jar:junit-jupiter-api-6.1.3.jar" \
            *.java

      - name: Run JUnit and emit XML
        run: |
          mkdir -p test-results
          java -jar junit-platform-console-standalone-6.1.3.jar \
            execute \
            --class-path "bin:project2.jar:junit-jupiter-api-6.1.3.jar:junit-jupiter-engine-6.1.3.jar" \
            --scan-class-path \
            --reports-dir=test-results

      # upload even if tests fail so the reporter can pick up failures
      - name: Upload JUnit XML artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: test-results/

  report:
    name: Publish Test Report
    runs-on: ubuntu-latest
    needs: build-test
    # run regardless of success/failure so you get annotations on failures too
    if: ${{ always() }}

    steps:
      - name: Download JUnit XML artifact
        uses: actions/download-artifact@v6
        with:
          name: test-results
          path: test-results

      - name: Annotate test results in Checks
        uses: dorny/test-reporter@v3
        with:
          artifact: test-results
          name: JUnit Tests
          path: '*.xml'
          reporter: java-junit
