name: CI

# Only run on PRs (so fork PRs can still upload the artifact with a read-only token)
on: [push, pull_request]

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Compile sources & tests
        run: |
          mkdir -p bin
          javac -d bin \
            -cp "project2.jar:junit-jupiter-api-6.1.3.jar" \
            *.java

      - name: Run JUnit and emit XML
        run: |
          mkdir -p test-results
          java -jar junit-platform-console-standalone-6.1.3.jar \
            execute \
            --class-path "bin:project2.jar:junit-jupiter-api-6.1.3.jar:junit-jupiter-engine-6.1.3.jar" \
            --scan-class-path \
            --reports-dir=test-results

      - name: Upload JUnit XML artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: test-results/
