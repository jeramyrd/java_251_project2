name: Java CI

on:
  push:
    branches: [ main ]      # or whichever branch you want
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Compile sources & tests
        run: |
          mkdir -p bin
          javac \
            -d bin \
            -cp "project2.jar:junit-jupiter-api-6.1.3.jar" \
            *.java
            
      - name: Run JUnit tests
        run: |
          mkdir -p test-results
          java -jar junit-platform-console-standalone-6.1.3.jar \
            execute \
            --class-path "bin:project2.jar:junit-jupiter-api-6.1.3.jar:junit-jupiter-engine-6.1.3.jar" \
            --scan-class-path \
            --details=flat \
            --reports-dir=test-results

      - name: Report test results to GitHub
        uses: dorny/test-reporter@v2
        if: always()                # run even if tests fail
        with:
          name: JUnit Tests         # check name
          path: test-results/*.xml  # glob to your XML files
          reporter: junit
          fail-on-error: false      # don’t fail the workflow if reporting fails

      - name: Archive test reports
        if: always()
        uses: actions/upload-artifact@main
        with:
          name: junit-logs
          path: |
            test-results/  # if you generate XML/HTML reports
